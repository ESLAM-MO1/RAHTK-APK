name: backend

on:
  push:
    paths:
      - 'backend/**'
      - 'tooling/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tooling/**'

jobs:
  verify:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: rahtk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, bcmath, intl, gd, zip, mbstring, xml, sockets
          coverage: none
          tools: composer:v2

      - name: Resolve Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
        working-directory: backend

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
        working-directory: backend

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
        working-directory: backend

      - name: Check formatting
        run: ./vendor/bin/pint --test
        working-directory: backend

      - name: Analyse static types
        run: ./vendor/bin/phpstan analyse --no-progress
        working-directory: backend

      - name: Reject source comments
        run: php tooling/comment-scan.php

      - name: Run tests
        run: php artisan test
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: rahtk_test
          DB_USERNAME: postgres
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
